name: Update CRAN download statistics

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cranlogs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install cranlogs
        run: |
          install.packages("cranlogs", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Update README statistics
        run: |
          Rscript update_cranlogs_readme.R

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update CRAN download statistics"
          git push
